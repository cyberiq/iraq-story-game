<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تغيير كلمة المرور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="auth-wrap">
      <section class="auth-card">
        <h1>تغيير كلمة المرور</h1>
        <form id="changePasswordForm" class="form-grid">
          <label>
            <span>كلمة المرور الحالية</span>
            <input id="currentPassword" type="password" required />
          </label>
          <label>
            <span>كلمة المرور الجديدة</span>
            <input id="newPassword" type="password" required minlength="4" />
          </label>
          <label>
            <span>تأكيد كلمة المرور الجديدة</span>
            <input id="confirmPassword" type="password" required minlength="4" />
          </label>
          <div class="form-actions">
            <button type="submit" class="btn-primary">تحديث كلمة المرور</button>
            <a class="btn-secondary" href="/admin">العودة للوحة الإدارة</a>
          </div>
        </form>
        <p id="changePasswordStatus" class="status" aria-live="polite"></p>
      </section>
    </main>

    <!-- Contact manager button -->
    <a class="contact-manager" href="/contact" aria-label="صفحة تواصل">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="wa" /> تواصل مع المدير
    </a>

    <script src="/change-password.js" defer></script>
  </body>
</html>
