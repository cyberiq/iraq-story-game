<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Cairo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Minimal reset to keep this page self-contained and visually consistent */
    :root{ --bg-1:#05060f; --bg-2:#0d1128; --bg-3:#1a1440; --gold:#e7b23c; --muted:#9aa3c0; --white:#eef0f8; --field-bg:rgba(255,255,255,.05); --field-border:rgba(255,255,255,.14); --danger:#e0655f; }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Cairo',sans-serif;background:radial-gradient(ellipse at 20% 10%, rgba(90,60,180,.25), transparent 55%),radial-gradient(ellipse at 80% 85%, rgba(30,120,140,.18), transparent 55%),linear-gradient(180deg,var(--bg-1),var(--bg-2) 55%,var(--bg-3));color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px}
    .stars{position:absolute;inset:0;z-index:0}
    .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
    .shooting{position:absolute;width:2px;height:2px;background:linear-gradient(90deg,#fff,transparent);border-radius:50%}

    .wrap{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:36px;max-width:980px;width:100%}
    .astro-zone{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
    .astro-glow{position:absolute;width:320px;height:320px;background:radial-gradient(circle, rgba(231,178,60,.16), transparent 70%);border-radius:50%;filter:blur(4px)}
    .astro{position:relative;width:min(300px,70vw);animation:drift 6s ease-in-out infinite}
    @keyframes drift{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(2deg)}}
    .orbit-planet{position:absolute;border-radius:50%}.p1{width:22px;height:22px;top:6%;left:0%;background:radial-gradient(circle at 35% 30%,#7fe0d0,#1c7e77);animation:floatSlow 5s ease-in-out infinite}.p2{width:13px;height:13px;bottom:8%;right:-2%;background:radial-gradient(circle at 35% 30%,#e08ce8,#7d2fae);animation:floatSlow 7s ease-in-out infinite reverse}@keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

    .form-zone{flex:1;max-width:380px;width:100%}
    .card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:38px 32px;backdrop-filter:blur(6px)}
    .eyebrow{color:var(--gold);font-size:13.5px;font-weight:600;margin-bottom:6px}
    h1{font-family:'Baloo 2',sans-serif;font-size:clamp(24px,3.4vw,30px);margin-bottom:8px;color:var(--white)}
    p.desc{color:var(--muted);font-size:14.5px;line-height:1.8;margin-bottom:28px}
    form{display:flex;flex-direction:column;gap:16px}
    .field{display:flex;flex-direction:column;gap:7px}
    label{font-size:13.5px;color:var(--muted)}
    .input-shell{display:flex;align-items:center;background:var(--field-bg);border:1px solid var(--field-border);border-radius:12px;padding:0 14px;transition:border-color .15s,box-shadow .15s}
    .input-shell:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(231,178,60,.14)}
    .input-shell input{flex:1;background:transparent;border:none;outline:none;color:var(--white);font-family:'Cairo',sans-serif;font-size:15px;padding:13px 4px}
    .input-shell input::placeholder{color:rgba(238,240,248,.32)}
    .toggle-visibility{background:none;border:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;padding:6px}
    .toggle-visibility:hover{color:var(--white)}
    .status-line{margin-top:16px;font-size:13.5px;color:var(--muted);text-align:center;min-height:18px}
    .status-line.ok{color:#7fd9b6}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:30px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;border:none;transition:transform .15s,box-shadow .2s,opacity .15s}
    .btn-primary{background:linear-gradient(135deg,var(--gold),#c98f28);color:#1a1005;box-shadow:0 10px 26px -10px rgba(231,178,60,.55)}
    .btn-primary:disabled{opacity:.65;cursor:default;box-shadow:none}
    @media (max-width:820px){.wrap{flex-direction:column}.astro-zone{order:1}.form-zone{order:2;max-width:400px}.card{padding:32px 26px}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">

  <div class="astro-zone">
    <div class="astro-glow"></div>
    <div class="orbit-planet p1"></div>
    <div class="orbit-planet p2"></div>

    <div class="astro">
      <!-- small illustrative SVG, decorative only -->
      <svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="150" cy="110" r="72" fill="#e7ded0" opacity=".06"/>
        <rect x="120" y="140" width="60" height="40" rx="8" fill="#c94b3f" opacity=".06"/>
      </svg>
    </div>
  </div>

  <div class="form-zone">
    <div class="card">
      <div class="eyebrow">مركز التحكم</div>
      <h1>تسجيل الدخول</h1>
      <p class="desc">أدخل بياناتك للوصول إلى حساب الإدارة.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">اسم المستخدم أو البريد الإلكتروني</label>
          <div class="input-shell">
            <input type="text" id="username" name="username" placeholder="اكتب اسم المستخدم" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="input-shell">
            <input type="password" id="password" name="password" placeholder="اكتب كلمة المرور" autocomplete="current-password" />
            <button type="button" class="toggle-visibility" id="togglePassword" aria-label="إظهار كلمة المرور">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div style="display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:6px;">
          <label style="color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="remember" name="remember" style="width:16px;height:16px;border-radius:4px;" /> تذكرني
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">تسجيل الدخول</button>
        <div class="status-line" id="loginStatus"></div>
      </form>
    </div>
  </div>

</div>

  <!-- Contact manager button -->
  <a class="contact-manager" href="/contact" aria-label="صفحة تواصل" style="position:fixed;left:18px;bottom:18px;z-index:5;color:var(--white);text-decoration:none;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(4px)">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="wa" style="width:18px;height:18px;filter:invert(1)" /> تواصل مع المدير
  </a>

  <!-- Visual helpers + password toggle. The actual login submission is handled by /login.js -->
  <script>
    // stars background
    const starsContainer = document.getElementById('stars');
    const STAR_COUNT = 90;
    for(let i=0;i<STAR_COUNT;i++){const s=document.createElement('div');s.className='star';const size=Math.random()*2+1;s.style.width=size+'px';s.style.height=size+'px';s.style.top=Math.random()*100+'%';s.style.left=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.animationDuration=(2+Math.random()*3)+'s';starsContainer.appendChild(s)}
    function spawnShootingStar(){const s=document.createElement('div');s.className='shooting';const top=Math.random()*50;const left=Math.random()*60+20;s.style.top=top+'%';s.style.left=left+'%';starsContainer.appendChild(s);s.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate(-220px,160px)',opacity:0}],{duration:1000,easing:'ease-in'}).onfinish=()=>s.remove()}setInterval(spawnShootingStar,3500);

    // password visibility toggle
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    toggleBtn.addEventListener('click',()=>{const isPassword = passwordInput.type==='password';passwordInput.type = isPassword ? 'text' : 'password'; toggleBtn.setAttribute('aria-label', isPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');});
  </script>

  <script src="/login.js" defer></script>
</body>
</html>
