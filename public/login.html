<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل دخول الإدارة | iraq story game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="login-wrap">
      <article class="login-card">
        <h1>دخول لوحة الإدارة</h1>
        <p>سجّل الدخول للوصول إلى إضافة وتعديل وحذف الشركات والألعاب.</p>
        <p class="hint-text">بيانات افتراضية محلية: username: admin - password: admin</p>

        <form id="loginForm" class="form-grid">
          <label>
            <span>اسم المستخدم</span>
            <input id="username" required autocomplete="username" />
          </label>

          <label>
            <span>كلمة المرور</span>
            <input id="password" type="password" required autocomplete="current-password" />
          </label>

          <button type="submit" class="btn-primary">دخول</button>
        </form>

        <p id="loginStatus" class="status" aria-live="polite"></p>
        <a class="btn-secondary" href="/">العودة للرئيسية</a>
      </article>
    </main>

    <script src="/login.js" defer></script>
  </body>
</html>
