<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>غير مصرح — 403</title>
  <link rel="stylesheet" href="/assets/blackbox-style.css">
  <style>
    body{ margin:0; font-family: 'Poppins', sans-serif; }
    .back-btn { display:inline-block; margin-top:18px; padding:10px 18px; background:#ff5252; color:#fff; border-radius:8px; text-decoration:none }
    .overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    .overlay .content{ text-align:center; padding:18px 28px; background:rgba(0,0,0,0.4); border-radius:10px }
    .overlay h1{ font-size:36px; margin:0 0 8px }
    .overlay p{ margin:0 0 12px; color:#cbd5e1 }
    canvas{ position:fixed; inset:0; width:100%; height:100%; display:block }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="overlay">
    <div class="content">
      <h1>غير مصرح</h1>
      <p>ليس لديك إذن للوصول إلى هذه الصفحة.</p>
      <a href="/" class="back-btn">العودة للرئيسية</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    function draw(){
      ctx.fillStyle = '#000';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const data = imageData.data;
      for(let i=0;i<data.length;i+=4){
        const color = Math.floor(Math.random()*255);
        data[i]=color; data[i+1]=color; data[i+2]=color; data[i+3]=255;
      }
      ctx.putImageData(imageData,0,0);
      requestAnimationFrame(draw);
    }

    resize(); draw(); window.addEventListener('resize', resize);
  </script>
</body>
</html>
