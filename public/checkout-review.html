<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعراض الطلب - متجر العراق</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .review-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: #1a1a2e;
      border-radius: 12px;
      color: #fff;
    }
    .review-header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #00d4ff;
      padding-bottom: 20px;
    }
    .review-header h1 {
      font-size: 24px;
      color: #00d4ff;
      margin: 0;
    }
    .order-items {
      margin-bottom: 30px;
    }
    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: #16213e;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    .order-item span:first-child {
      flex: 1;
    }
    .order-item span:last-child {
      color: #00d4ff;
      font-weight: bold;
    }
    .order-summary {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #00d4ff;
    }
    .summary-row.total {
      color: #00d4ff;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 2px solid #00d4ff;
      padding-bottom: 15px;
    }
    .customer-form {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #00d4ff;
      font-weight: bold;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #0f3460;
      border: 1px solid #00d4ff;
      color: #fff;
      border-radius: 4px;
      font-family: inherit;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      padding: 12px 30px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: #00d4ff;
      color: #1a1a2e;
    }
    .btn-primary:hover {
      background: #00b8cc;
      transform: scale(1.05);
    }
    .btn-secondary {
      background: #555;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #777;
    }
    .empty-message {
      text-align: center;
      color: #ff6b6b;
      margin: 30px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header class="store-header">
    <div class="header-bar">
      <div class="brand-copy">
        <span>IQ</span>
        <div>
          <strong>متجر العراق</strong>
          <span>مركز المتجر</span>
        </div>
      </div>
      <div style="display: flex; gap: 15px; align-items: center;">
        <button class="language-toggle" id="languageToggle" style="background: none; border: none; color: #00d4ff; cursor: pointer; font-weight: bold;">AR / EN</button>
        <button class="cart-button" id="backButton" style="background: none; border: none; color: #00d4ff; cursor: pointer; font-weight: bold;">← العودة</button>
      </div>
    </div>
  </header>

  <main>
    <div id="reviewContent" class="review-container">
      <!-- Will be populated by JavaScript -->
    </div>
  </main>

  <script>
    const language = localStorage.getItem('iraqGameLanguage') || 'ar';
    const cart = JSON.parse(localStorage.getItem('iraqGameCart') || '[]');
    const checkoutReview = JSON.parse(localStorage.getItem('iraqGameCheckoutReview') || '{}');

    const labels = {
      ar: {
        reviewTitle: 'استعراض الطلب',
        itemsHeader: 'الألعاب والمنتجات',
        subtotal: 'الإجمالي',
        coupon: 'الكوبون',
        discount: 'الخصم',
        total: 'المجموع النهائي',
        customerName: 'اسم العميل',
        phoneNumber: 'رقم الهاتف',
        email: 'البريد الإلكتروني',
        notes: 'ملاحظات إضافية',
        completeOrder: 'إتمام الشراء عبر WhatsApp',
        backToCart: 'العودة للسلة',
        emptyCart: 'السلة فارغة! لا توجد عناصر للشراء'
      },
      en: {
        reviewTitle: 'Order Review',
        itemsHeader: 'Games & Products',
        subtotal: 'Subtotal',
        coupon: 'Coupon',
        discount: 'Discount',
        total: 'Total',
        customerName: 'Customer Name',
        phoneNumber: 'Phone Number',
        email: 'Email',
        notes: 'Additional Notes',
        completeOrder: 'Complete Purchase via WhatsApp',
        backToCart: 'Back to Cart',
        emptyCart: 'Cart is empty! No items to purchase'
      }
    };

    const l = labels[language] || labels.ar;

    function formatPrice(price, currency = 'IQD') {
      if (currency === 'USD' || currency === '$') {
        return `$${Number(price || 0).toLocaleString('en-US')}`;
      }
      return `${Number(price || 0).toLocaleString('en-US')} د.ع`;
    }

    function renderReview() {
      const container = document.getElementById('reviewContent');

      if (!cart.length) {
        container.innerHTML = `<div class="empty-message">${l.emptyCart}</div>`;
        return;
      }

      let html = `<div class="review-header"><h1>${l.reviewTitle}</h1></div>`;
      html += `<div class="order-items" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;"><h3 style="margin: 0;">${l.itemsHeader}</h3><button id="clearReviewCartBtn" type="button" style="background: #ff6b6b; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">${language === 'ar' ? 'إفراغ السلة' : 'Clear Cart'}</button></div>`;
      html += `<div class="order-items">`;

      let subtotal = 0;
      cart.forEach((item, idx) => {
        const itemTotal = Number(item.price || 0) * Number(item.qty || 0);
        subtotal += itemTotal;
        html += `
          <div class="order-item" style="display: flex; justify-content: space-between; align-items: center;">
            <div style="flex: 1;">
              <span>${item.name}</span><br>
              <span style="font-size: 14px;">${item.qty} × ${formatPrice(item.price)} = ${formatPrice(itemTotal)}</span>
            </div>
            <button type="button" class="delete-review-item-btn" data-index="${idx}" style="background: #ff6b6b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 10px;">${language === 'ar' ? 'حذف' : 'Delete'}</button>
          </div>
        `;
      });

      html += '</div>';

      let discountAmount = 0;
      let discountPercent = checkoutReview.discountPercent || 0;
      if (discountPercent > 0) {
        discountAmount = subtotal * (discountPercent / 100);
      }
      const finalTotal = subtotal - discountAmount;

      html += `<div class="order-summary">`;
      html += `<div class="summary-row"><span>${l.subtotal}</span><span>${formatPrice(subtotal)}</span></div>`;
      if (checkoutReview.coupon) {
        html += `<div class="summary-row"><span>${l.coupon}</span><span>${checkoutReview.coupon}</span></div>`;
      }
      if (discountAmount > 0) {
        html += `<div class="summary-row"><span>${l.discount} (${discountPercent}%)</span><span>-${formatPrice(discountAmount)}</span></div>`;
      }
      html += `<div class="summary-row total"><span>${l.total}</span><span>${formatPrice(finalTotal)}</span></div>`;
      html += `</div>`;

      html += `<div class="customer-form">`;
      html += `
        <div class="form-group">
          <label>${l.customerName}</label>
          <input type="text" id="customerName" value="${checkoutReview.name || ''}" placeholder="${l.customerName}">
        </div>
        <div class="form-group">
          <label>${l.phoneNumber}</label>
          <input type="tel" id="customerPhone" value="${checkoutReview.phone || ''}" placeholder="${l.phoneNumber}">
        </div>
        <div class="form-group">
          <label>${l.email}</label>
          <input type="email" id="customerEmail" value="${checkoutReview.email || ''}" placeholder="${l.email}">
        </div>
        <div class="form-group">
          <label>${l.notes}</label>
          <textarea id="customerNotes" placeholder="${l.notes}">${checkoutReview.notes || ''}</textarea>
        </div>
      `;
      html += `</div>`;

      html += `
        <div class="action-buttons">
          <button class="btn btn-primary" id="completeBtn">${l.completeOrder}</button>
          <button class="btn btn-secondary" id="backBtn">${l.backToCart}</button>
        </div>
      `;

      container.innerHTML = html;

      document.getElementById('completeBtn').addEventListener('click', completeOrder);
      document.getElementById('backBtn').addEventListener('click', () => {
        window.history.back();
      });

      // Delete item buttons
      document.querySelectorAll('.delete-review-item-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const idx = Number(e.target.dataset.index);
          const updatedCart = cart.filter((_, i) => i !== idx);
          localStorage.setItem('iraqGameCart', JSON.stringify(updatedCart));
          location.reload();
        });
      });

      // Clear cart button
      const clearBtn = document.getElementById('clearReviewCartBtn');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          const confirmMsg = language === 'ar' ? 'هل أنت متأكد من حذف جميع العناصر من السلة؟' : 'Are you sure you want to clear all items from cart?';
          if (confirm(confirmMsg)) {
            localStorage.setItem('iraqGameCart', JSON.stringify([]));
            location.reload();
          }
        });
      }
    }

    async function completeOrder() {
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const email = document.getElementById('customerEmail').value.trim();
      const notes = document.getElementById('customerNotes').value.trim();

      if (!name || !phone) {
        alert(language === 'ar' ? 'يرجى ملء الاسم ورقم الهاتف' : 'Please fill in name and phone number');
        return;
      }

      try {
        const response = await fetch('/api/admin/settings');
        const settings = await response.json();
        const whatsappNumber = settings.whatsappNumber || '+9647xxxxx';

        const subtotal = cart.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0);
        const discountPercent = checkoutReview.discountPercent || 0;
        const discountAmount = subtotal * (discountPercent / 100);
        const finalTotal = subtotal - discountAmount;

        const message = `
*${language === 'ar' ? 'طلب شراء جديد' : 'New Purchase Order'}*

${language === 'ar' ? 'الاسم' : 'Name'}: ${name}
${language === 'ar' ? 'الهاتف' : 'Phone'}: ${phone}
${language === 'ar' ? 'البريد' : 'Email'}: ${email}

*${language === 'ar' ? 'الألعاب والمنتجات' : 'Items'}:*
${cart.map(item => `• ${item.name} (${item.qty}x ${item.price})`).join('\n')}

${language === 'ar' ? 'الإجمالي الأساسي' : 'Subtotal'}: ${subtotal}
${checkoutReview.coupon ? `${language === 'ar' ? 'الكوبون' : 'Coupon'}: ${checkoutReview.coupon}` : ''}
${discountAmount > 0 ? `${language === 'ar' ? 'الخصم' : 'Discount'}: -${discountAmount}` : ''}

*${language === 'ar' ? 'المجموع النهائي' : 'Total'}*: ${finalTotal}

${notes ? `${language === 'ar' ? 'ملاحظات' : 'Notes'}: ${notes}` : ''}
        `.trim();

        const whatsappUrl = `https://wa.me/${whatsappNumber.replace(/\D/g, '')}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');

        localStorage.removeItem('iraqGameCart');
        localStorage.removeItem('iraqGameCheckoutReview');
      } catch (error) {
        console.error(error);
        alert(language === 'ar' ? 'حدث خطأ في معالجة الطلب' : 'Error processing order');
      }
    }

    document.getElementById('languageToggle').addEventListener('click', () => {
      const newLang = language === 'ar' ? 'en' : 'ar';
      localStorage.setItem('iraqGameLanguage', newLang);
      window.location.reload();
    });

    document.getElementById('backButton').addEventListener('click', () => {
      window.history.back();
    });

    renderReview();
  </script>
</body>
</html>
