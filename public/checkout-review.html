<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مراجعة الطلب | Iraq Game Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .review-wrap {
        width: min(980px, 92vw);
        margin: 0 auto;
        padding: 32px 0 48px;
      }
      .review-card {
        background: linear-gradient(180deg, rgba(18, 31, 49, 0.98), rgba(12, 19, 28, 0.98));
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 22px;
        box-shadow: 0 24px 55px rgba(0, 0, 0, 0.42);
        padding: 24px;
      }
      .review-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .review-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
      }
      .review-box {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 16px;
        padding: 18px;
      }
      .review-items {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .review-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }
      .review-item-main {
        display: grid;
        gap: 4px;
      }
      .qty-control {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .qty-value {
        min-width: 20px;
        text-align: center;
        font-weight: 800;
        color: var(--ink);
      }
      .remove-item-btn {
        border: 1px solid rgba(255, 127, 107, 0.34);
        background: rgba(255, 127, 107, 0.08);
        color: #ffb3a7;
        border-radius: 10px;
        padding: 6px 10px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .review-summary {
        display: grid;
        gap: 10px;
      }
      .summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .summary-row.total {
        border-top: 1px solid rgba(148, 163, 184, 0.12);
        padding-top: 12px;
        font-size: 1.08rem;
        font-weight: 800;
      }
      .review-form {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }
      .review-form label {
        display: grid;
        gap: 8px;
        color: var(--ink);
        font-weight: 700;
      }
      .review-form input {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 32, 0.9);
        color: var(--ink);
        font: inherit;
        padding: 0 12px;
      }
      .review-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }
      @media (max-width: 760px) {
        .review-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="review-wrap">
      <div class="review-card">
        <div class="review-header">
          <div>
            <p class="hero-kicker" style="margin:0;">Review order</p>
            <h1 style="margin:10px 0 0;">مراجعة الطلب</h1>
          </div>
          <a class="btn-secondary" href="/">العودة للسلة</a>
        </div>

        <div class="review-grid">
          <section class="review-box">
            <h2>تفاصيل الطلب</h2>
            <div id="reviewItems" class="review-items"></div>
          </section>

          <aside class="review-box">
            <h2>ملخص الفاتورة</h2>
            <div id="reviewSummary" class="review-summary"></div>
          </aside>
        </div>

        <form id="customerReviewForm" class="review-form">
          <label>
            <span>اسم العميل</span>
            <input id="customerNameInput" type="text" placeholder="مثال: محمد علي" required />
          </label>
          <label>
            <span>رقم الهاتف</span>
            <input id="customerPhoneInput" type="tel" placeholder="966500000000" required />
          </label>
          <div class="review-actions">
            <button type="submit" class="btn-primary">تأكيد الطلب ومتابعة التواصل</button>
            <a class="btn-secondary" href="/">تعديل السلة</a>
          </div>
        </form>
      </div>
    </main>

    <script>
      function formatPrice(value, currency = 'IQD') {
        const numeric = Number(value || 0);
        if (!Number.isFinite(numeric) || numeric <= 0) return 'مجانية';
        const label = String(currency || 'IQD').toUpperCase() === 'USD' ? '$' : 'د.ع';
        return `${numeric.toLocaleString('en-US')} ${label}`;
      }

      function getCurrentReview() {
        const raw = localStorage.getItem('iraqGameCheckoutReview');
        if (!raw) {
          return null;
        }

        try {
          return JSON.parse(raw);
        } catch (error) {
          console.error(error);
          return null;
        }
      }

      function syncReviewToCart(items, coupon) {
        const subtotal = items.reduce((sum, item) => sum + Number(item.qty || 0) * Number(item.price || 0), 0);
        const discount = coupon && Number(coupon.percent || 0) > 0 ? (subtotal * Number(coupon.percent || 0)) / 100 : 0;
        const total = Math.max(0, subtotal - discount);

        const review = {
          items,
          coupon: coupon || null,
          subtotal,
          discount,
          total,
          createdAt: new Date().toISOString()
        };

        localStorage.setItem('iraqGameCheckoutReview', JSON.stringify(review));
        localStorage.setItem('iraqGameCart', JSON.stringify(items.map((item) => ({
          id: item.id,
          qty: item.qty,
          name: item.name,
          price: Number(item.price || 0)
        }))));
        return review;
      }

      function updateItemQuantity(itemId, change) {
        const review = getCurrentReview();
        if (!review || !Array.isArray(review.items)) {
          return;
        }

        const items = review.items.map((item) => {
          if (Number(item.id) !== Number(itemId)) return item;
          const nextQty = Number(item.qty || 0) + change;
          return { ...item, qty: Math.max(0, nextQty) };
        }).filter((item) => Number(item.qty || 0) > 0);

        if (!items.length) {
          localStorage.removeItem('iraqGameCheckoutReview');
          localStorage.removeItem('iraqGameCart');
          window.location.href = '/';
          return;
        }

        syncReviewToCart(items, review.coupon || null);
        loadReviewState();
      }

      function removeItemFromReview(itemId) {
        const review = getCurrentReview();
        if (!review || !Array.isArray(review.items)) {
          return;
        }

        const items = review.items.filter((item) => Number(item.id) !== Number(itemId));
        if (!items.length) {
          localStorage.removeItem('iraqGameCheckoutReview');
          localStorage.removeItem('iraqGameCart');
          window.location.href = '/';
          return;
        }

        syncReviewToCart(items, review.coupon || null);
        loadReviewState();
      }

      function loadReviewState() {
        const review = getCurrentReview();
        if (!review || !Array.isArray(review.items) || !review.items.length) {
          window.location.href = '/';
          return;
        }

        const items = review.items;
        const subtotal = Number(review.subtotal || items.reduce((sum, item) => sum + Number(item.qty || 0) * Number(item.price || 0), 0));
        const discount = Number(review.discount || 0);
        const total = Number(review.total || Math.max(0, subtotal - discount));
        const couponCode = review.coupon?.code || 'لا يوجد';

        const itemsWrap = document.getElementById('reviewItems');
        const summaryWrap = document.getElementById('reviewSummary');

        itemsWrap.innerHTML = items.map((item) => `
          <div class="review-item">
            <div class="review-item-main">
              <strong>${item.name}</strong>
              <span>${formatPrice(Number(item.price || 0), 'IQD')} • ${Number(item.qty || 0)} x</span>
            </div>
            <div class="qty-control">
              <span class="qty-value">${item.qty}</span>
              <button type="button" class="remove-item-btn" data-remove-id="${item.id}">حذف</button>
            </div>
          </div>
        `).join('');

        itemsWrap.querySelectorAll('.remove-item-btn').forEach((button) => {
          button.addEventListener('click', () => {
            removeItemFromReview(button.getAttribute('data-remove-id'));
          });
        });

        summaryWrap.innerHTML = `
          <div class="summary-row"><span>المجموع الفرعي</span><strong>${formatPrice(subtotal, 'IQD')}</strong></div>
          <div class="summary-row"><span>الخصم</span><strong>${discount > 0 ? `-${formatPrice(discount, 'IQD')}` : formatPrice(0, 'IQD')}</strong></div>
          <div class="summary-row"><span>كوبون الخصم</span><strong>${couponCode}</strong></div>
          <div class="summary-row total"><span>الإجمالي النهائي</span><strong>${formatPrice(total, 'IQD')}</strong></div>
        `;
      }

      document.getElementById('customerReviewForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = document.getElementById('customerNameInput').value.trim();
        const phone = document.getElementById('customerPhoneInput').value.trim();

        if (!name || !phone) {
          alert('يرجى إدخال الاسم ورقم الهاتف.');
          return;
        }

        const review = getCurrentReview();
        if (!review) {
          alert('لا توجد عناصر في الطلب.');
          return;
        }

        localStorage.setItem('iraqGameCustomerData', JSON.stringify({ name, phone }));
        const reviewWithCustomer = { ...review, customer: { name, phone } };
        localStorage.setItem('iraqGameCheckoutReview', JSON.stringify(reviewWithCustomer));
        window.location.href = '/contact';
      });

      window.addEventListener('DOMContentLoaded', loadReviewState);
    </script>
  </body>
</html>
