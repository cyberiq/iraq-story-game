<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراجعة الطلب</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Cairo:wght@400;500;600;700;800&display=swap');

  :root{
    --bg-1:#05060f;
    --bg-2:#0d1128;
    --bg-3:#1a1440;
    --gold:#e7b23c;
    --teal:#3fa0d6;
    --mint:#7fd9b6;
    --muted:#9aa3c0;
    --white:#eef0f8;
    --card-bg:rgba(255,255,255,.035);
    --card-border:rgba(255,255,255,.09);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; }

  body{
    font-family:'Cairo', sans-serif;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(90,60,180,.22), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(30,120,140,.16), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
    color:var(--white);
    min-height:100vh;
    position:relative;
    padding:32px 20px 60px;
    overflow-x:hidden;
  }

  .stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .star{ position:absolute; background:#fff; border-radius:50%; animation:twinkle 3s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.22;} 50%{opacity:1;} }

  .page{
    position:relative;
    z-index:2;
    max-width:1040px;
    margin:0 auto;
  }

  .steps{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-bottom:38px;
    flex-wrap:wrap;
  }
  .step{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    color:var(--muted);
  }
  .step .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    flex-shrink:0;
  }
  .step.done{ color:var(--white); }
  .step.done .dot{ background:var(--mint); }
  .step.active{ color:var(--gold); font-weight:600; }
  .step.active .dot{ background:var(--gold); box-shadow:0 0 0 4px rgba(231,178,60,.18); }
  .step-line{
    width:34px; height:1px;
    background:rgba(255,255,255,.16);
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-size:clamp(24px, 3.4vw, 30px);
    text-align:center;
    margin-bottom:6px;
  }
  .page-sub{
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
    margin-bottom:36px;
  }

  .layout{
    display:grid;
    grid-template-columns:1.55fr 1fr;
    gap:22px;
    align-items:start;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:24px;
  }
  .card + .card{ margin-top:18px; }

  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .card-head h2{
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    font-weight:600;
  }
  .edit-link{
    font-size:13px;
    color:var(--teal);
    text-decoration:none;
    border-bottom:1px dashed rgba(63,160,214,.5);
    padding-bottom:1px;
  }
  .edit-link:hover{ color:#6cc0ec; }

  .item-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    opacity:0;
    transform:translateY(10px);
    animation:riseIn .5s ease forwards;
  }
  .item-row:last-child{ border-bottom:none; }

  .thumb{
    width:56px; height:56px;
    border-radius:12px;
    flex-shrink:0;
    background:linear-gradient(135deg, var(--thumb-a,#3fa0d6), var(--thumb-b,#7d2fae));
    position:relative;
    overflow:hidden;
  }
  .thumb::after{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), transparent 55%);
  }

  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:14.5px; font-weight:600; margin-bottom:3px; }
  .item-meta{ font-size:12.5px; color:var(--muted); }

  .item-qty{
    font-size:13px;
    color:var(--muted);
    background:rgba(255,255,255,.05);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:4px 12px;
    flex-shrink:0;
  }

  .item-price{
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    color:var(--gold);
    flex-shrink:0;
    min-width:64px;
    text-align:left;
  }

  .info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  .info-line{ font-size:14px; line-height:1.9; color:var(--white); }
  .info-line .label{ display:block; color:var(--muted); font-size:12.5px; margin-bottom:3px; }

  .pay-method{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
  }
  .card-chip{
    width:34px; height:24px;
    border-radius:5px;
    background:linear-gradient(135deg,#e7b23c,#c98f28);
    flex-shrink:0;
  }

  .summary-card{ position:sticky; top:24px; }
  .summary-row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--muted);
    padding:8px 0;
  }
  .summary-row span:last-child{ color:var(--white); }
  .summary-row.total{
    border-top:1px solid rgba(255,255,255,.1);
    margin-top:8px;
    padding-top:14px;
    font-size:16px;
    font-weight:600;
  }
  .summary-row.total span:last-child{
    font-family:'Baloo 2', sans-serif;
    color:var(--gold);
    font-size:20px;
  }

  .promo-row{
    display:flex;
    gap:8px;
    margin:16px 0 4px;
  }
  .promo-row input{
    flex:1;
    background:rgba(255,255,255,.05);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:10px 12px;
    color:var(--white);
    font-family:inherit;
    font-size:13.5px;
    outline:none;
  }
  .promo-row input:focus{ border-color:var(--gold); }
  .promo-row button{
    background:rgba(255,255,255,.07);
    border:1px solid var(--card-border);
    color:var(--white);
    border-radius:10px;
    padding:0 16px;
    font-size:13.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .promo-row button:hover{ border-color:rgba(255,255,255,.3); }

  .coupon-notice{
    margin-top:10px;
    display:none;
    align-items:center;
    gap:8px;
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.6;
    border:1px solid transparent;
    background:rgba(255,255,255,.04);
    color:var(--white);
  }
  .coupon-notice.visible{ display:flex; }
  .coupon-notice.error{
    background:rgba(255, 94, 94, 0.08);
    border-color:rgba(255, 94, 94, 0.28);
    color:#ffc9c9;
  }
  .coupon-notice.success{
    background:rgba(127, 217, 182, 0.08);
    border-color:rgba(127, 217, 182, 0.3);
    color:#d8ffef;
  }
  .coupon-notice::before{
    content:'!';
    width:18px;
    height:18px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-weight:700;
    background:rgba(255,255,255,.08);
  }
  .coupon-notice.success::before{
    content:'✓';
    background:rgba(127, 217, 182, 0.12);
  }

  .confirm-zone{
    position:relative;
    margin-top:22px;
    min-height:52px;
  }

  .confirm-btn{
    width:100%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 20px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    font-family:'Baloo 2', sans-serif;
    font-size:16px;
    font-weight:600;
    color:#1a1005;
    background:linear-gradient(135deg, var(--gold), #c98f28);
    box-shadow:0 12px 28px -12px rgba(231,178,60,.55);
    overflow:visible;
    transition:box-shadow .2s, transform .15s;
  }
  .confirm-btn:hover{ box-shadow:0 16px 34px -12px rgba(231,178,60,.7); }
  .confirm-btn:active{ transform:scale(.98); }
  .confirm-btn:disabled{ cursor:default; }

  .rocket-icon{
    width:18px; height:18px;
    display:inline-flex;
    transition:transform .2s;
  }

  .confirm-btn.launching .btn-label{ opacity:0; }
  .confirm-btn.launching{ box-shadow:none; }

  .rocket-fly{
    position:absolute;
    left:50%;
    bottom:50%;
    width:22px;
    height:22px;
    margin-left:-11px;
    pointer-events:none;
    opacity:0;
  }
  .rocket-fly.go{ animation:launch 1.1s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes launch{
    0%{ opacity:1; transform:translateY(0) rotate(0deg) scale(1); }
    15%{ transform:translateY(-6px) rotate(-4deg) scale(1.05); }
    100%{ transform:translateY(-220px) rotate(-2deg) scale(.6); opacity:0; }
  }

  .trail{
    position:absolute;
    left:50%;
    bottom:38%;
    width:3px;
    margin-left:-1.5px;
    border-radius:3px;
    background:linear-gradient(180deg, rgba(231,178,60,.85), transparent);
    opacity:0;
  }
  .trail.go{ animation:trailGrow 1.1s ease-out forwards; }
  @keyframes trailGrow{
    0%{ height:0; opacity:.9; }
    70%{ height:170px; opacity:.5; }
    100%{ height:190px; opacity:0; }
  }

  .success-panel{
    display:none;
    text-align:center;
    padding:10px 4px 4px;
  }
  .success-panel.show{ display:block; animation:riseIn .5s ease forwards; }

  .success-badge{
    width:56px; height:56px;
    border-radius:50%;
    background:rgba(127,217,182,.14);
    border:1px solid rgba(127,217,182,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 14px;
  }
  .success-badge svg{ width:26px; height:26px; }

  .success-title{
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    margin-bottom:6px;
  }
  .success-sub{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.8;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; }
    .summary-card{ position:static; }
    .info-grid{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
 <div class="stars" id="stars"></div>
 <div class="page">
   <div class="steps">
    <div class="step done"><span class="dot"></span>الشحن</div>
    <div class="step-line"></div>
    <div class="step active"><span class="dot"></span>المراجعة</div>
    <div class="step-line"></div>
    <div class="step"><span class="dot"></span>الدفع</div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:12px; flex-wrap:wrap;">
    <a href="/" style="display:inline-flex; align-items:center; justify-content:center; padding:10px 16px; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#fff; text-decoration:none; font-weight:600;">← العودة إلى القائمة الرئيسية</a>
  </div>

  <h1>راجع طلبك قبل الإطلاق</h1>
  <p class="page-sub">تأكد من التفاصيل، ثم اضغط تأكيد الطلب لإتمام العملية</p>

  <div class="layout">
    <div class="col-main">
      <div class="card">
        <div class="card-head">
          <h2 id="itemsTitle">المنتجات</h2>
          <button type="button" class="edit-link" id="toggleCartEditor" style="background:none;border:none;cursor:pointer;">تعديل</button>
        </div>

        <div id="checkoutItems"></div>
      </div>
    </div>

    <div class="col-side">
      <div class="card summary-card">
        <div class="card-head">
          <h2>ملخص الطلب</h2>
        </div>

        <div class="summary-row"><span>المجموع الفرعي</span><span id="subtotalValue">0 د.ع</span></div>
        <div class="summary-row"><span>الشحن</span><span id="shippingValue">0 د.ع</span></div>
        <div class="summary-row"><span>الخصم</span><span id="discountValue">0 د.ع</span></div>
        <div class="summary-row total"><span>الإجمالي</span><span id="totalValue">0 د.ع</span></div>

        <div class="promo-row">
          <input id="couponInput" type="text" placeholder="كود الخصم" />
          <button type="button" id="applyCouponBtn">تطبيق</button>
        </div>
        <div id="couponNotice" class="coupon-notice" aria-live="polite"></div>

        <div class="confirm-zone">
          <button class="confirm-btn" id="confirmBtn" type="button">
            <svg class="rocket-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
              <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
            </svg>
            <span class="btn-label">تأكيد الطلب</span>
            <div class="trail" id="trail"></div>
            <div class="rocket-fly" id="rocketFly">
              <svg viewBox="0 0 24 24" fill="none" stroke="#e7b23c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
                <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
                <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
              </svg>
            </div>
          </button>

          <div class="success-panel" id="successPanel">
            <div class="success-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="#7fd9b6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6L9 17l-5-5"/>
              </svg>
            </div>
            <div class="success-title">تم تأكيد طلبك</div>
            <div class="success-sub">سنرسل لك تفاصيل الطلب على واتساب</div>
          </div>
        </div>
      </div>
    </div>
  </div>
 </div>

<script>
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 70;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.top = Math.random() * 100 + '%';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    starsContainer.appendChild(s);
  }

  const checkoutItemsWrap = document.getElementById('checkoutItems');
  const subtotalValue = document.getElementById('subtotalValue');
  const shippingValue = document.getElementById('shippingValue');
  const discountValue = document.getElementById('discountValue');
  const totalValue = document.getElementById('totalValue');
  const couponInput = document.getElementById('couponInput');
  const applyCouponBtn = document.getElementById('applyCouponBtn');
  const couponNotice = document.getElementById('couponNotice');
  const confirmBtn = document.getElementById('confirmBtn');
  const rocketFly = document.getElementById('rocketFly');
  const trail = document.getElementById('trail');
  const successPanel = document.getElementById('successPanel');

  function showCouponNotice(message, type = 'error') {
    if (!couponNotice) return;
    couponNotice.textContent = message;
    couponNotice.classList.remove('visible', 'error', 'success');
    couponNotice.classList.add(type, 'visible');
  }

  const priceFormat = (value) => `${Number(value || 0).toLocaleString('en-US')} د.ع`;

  function getCartItems() {
    try {
      return JSON.parse(localStorage.getItem('iraqGameCart') || '[]');
    } catch (error) {
      return [];
    }
  }

  function saveCartItems(items) {
    localStorage.setItem('iraqGameCart', JSON.stringify(items));
  }

  function updateCartItem(id, delta) {
    const items = getCartItems();
    const next = items
      .map((item) => {
        if (String(item.id) === String(id)) {
          const qty = Math.max(0, Number(item.qty || 1) + delta);
          return qty > 0 ? { ...item, qty } : null;
        }
        return item;
      })
      .filter(Boolean);

    saveCartItems(next);
    renderCheckout();
  }

  function removeCartItem(id) {
    const items = getCartItems().filter((item) => String(item.id) !== String(id));
    saveCartItems(items);
    renderCheckout();
  }

  let couponPercent = 0;

  function renderCheckout() {
    const items = getCartItems();
    const shipping = items.length ? 2500 : 0;
    const subtotal = items.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 1), 0);
    const discount = Math.round(subtotal * (couponPercent / 100));
    const total = subtotal + shipping - discount;

    document.getElementById('itemsTitle').textContent = `المنتجات (${items.length})`;
    subtotalValue.textContent = priceFormat(subtotal);
    shippingValue.textContent = priceFormat(shipping);
    discountValue.textContent = `-${priceFormat(discount)}`;
    totalValue.textContent = priceFormat(total);

    if (!items.length) {
      checkoutItemsWrap.innerHTML = `
        <div class="empty-cart" style="padding:18px 8px; text-align:center;">
          <div class="empty-icon" style="font-size:42px; margin-bottom:12px;">🛒</div>
          <h3 style="margin-bottom:10px;">السلة فارغة</h3>
          <p style="color:#9aa3c0; margin-bottom:16px;">لا توجد ألعاب في السلة الآن.</p>
          <a href="/" class="edit-link" style="display:inline-block; padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.12);">العودة للتسوق</a>
        </div>
      `;
      return;
    }

    checkoutItemsWrap.innerHTML = items.map((item, index) => {
      const name = item.name_ar || item.name_en || item.name || 'منتج';
      const qty = Number(item.qty || 1);
      const price = Number(item.price || 0) * qty;
      const thumb = item.cover_image_url || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80';
      return `
        <div class="item-row" style="animation-delay:${index * 0.08}s; --thumb-a:#3fa0d6; --thumb-b:#7d2fae;">
          <div class="thumb" style="background:linear-gradient(135deg, #3fa0d6, #7d2fae); background-image: url('${thumb}'); background-size:cover; background-position:center;"></div>
          <div class="item-info">
            <div class="item-name">${name}</div>
            <div class="item-meta">الكمية: ${qty}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px; margin-inline:10px;">
            <button type="button" data-action="minus" data-id="${item.id}" style="width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#fff;cursor:pointer;">-</button>
            <span class="item-qty" style="min-width:34px; text-align:center;">${qty}</span>
            <button type="button" data-action="plus" data-id="${item.id}" style="width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#fff;cursor:pointer;">+</button>
          </div>
          <button type="button" data-action="remove" data-id="${item.id}" style="padding:7px 10px;border-radius:8px;border:1px solid rgba(239,91,107,0.25);background:rgba(239,91,107,0.12);color:#ffc7cc;cursor:pointer;">حذف</button>
          <div class="item-price">${priceFormat(price)}</div>
        </div>
      `;
    }).join('');

    checkoutItemsWrap.querySelectorAll('[data-action]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'plus') updateCartItem(id, 1);
        if (action === 'minus') updateCartItem(id, -1);
        if (action === 'remove') removeCartItem(id);
      });
    });
  }

  applyCouponBtn.textContent = 'تفعيل كود الخصم';
  applyCouponBtn.addEventListener('click', async () => {
    const code = couponInput.value.trim();
    if (!code) {
      showCouponNotice('أدخل رمز الخصم أولاً', 'error');
      return;
    }

    try {
      const response = await fetch('/api/coupons/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.error || 'الكوبون غير صالح');
      }
      couponPercent = Number(payload.percent || 0);
      renderCheckout();
      showCouponNotice(`تم تطبيق الخصم: ${couponPercent}%`, 'success');
    } catch (error) {
      couponPercent = 0;
      renderCheckout();
      showCouponNotice(error.message || 'الكوبون غير صالح', 'error');
    }
  });

  document.getElementById('toggleCartEditor').addEventListener('click', () => {
    const items = getCartItems();
    if (!items.length) {
      alert('السلة فارغة، لا يوجد شيء لتعديله');
      return;
    }
    renderCheckout();
    const first = checkoutItemsWrap.querySelector('[data-action="plus"]');
    if (first) first.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  confirmBtn.addEventListener('click', () => {
    if (confirmBtn.disabled) return;
    const cartItems = getCartItems();
    if (!cartItems.length) {
      alert('السلة فارغة');
      return;
    }

    confirmBtn.disabled = true;
    confirmBtn.classList.add('launching');
    rocketFly.classList.add('go');
    trail.classList.add('go');

    setTimeout(() => {
      confirmBtn.style.display = 'none';
      successPanel.classList.add('show');
    }, 950);

    const whatsappNumber = '7713377783';
    const message = cartItems.map((item, index) => {
      const qty = Number(item.qty || 1);
      const name = item.name_ar || item.name_en || item.name || 'منتج';
      const price = Number(item.price || 0) * qty;
      return `${index + 1}. ${name} × ${qty} — ${price} د.ع`;
    }).join('\n');

    const subtotal = cartItems.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 1), 0);
    const shipping = cartItems.length ? 2500 : 0;
    const discount = Math.round(subtotal * (couponPercent / 100));
    const total = subtotal + shipping - discount;
    const fullMessage = `طلب شراء جديد:\n${message}\n\nالمجموع الفرعي: ${subtotal} د.ع\nالشحن: ${shipping} د.ع\nالخصم: ${discount} د.ع\nالإجمالي: ${total} د.ع`;
    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(fullMessage)}`;
    const opened = window.open(url, '_blank', 'noopener,noreferrer');
    if (!opened) {
      window.location.href = url;
    }
    localStorage.removeItem('iraqGameCart');
  });

  renderCheckout();
</script>
</body>
</html>
