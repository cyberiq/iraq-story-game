<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <!-- Use remote style from the source site to keep the same look -->
    <link rel="stylesheet" href="https://mjavadh.github.io/4X4-Collection/Fantasy/Black%20Box/assets/style.css">
    <style>
      /* minimal overrides to ensure readability on our site */
      body { background: #07070a; color: #fff; font-family: 'Tajawal', sans-serif; }
      a.back-btn { display:inline-block; margin-top:18px; padding:10px 18px; background:#ff6b6b; color:#fff; border-radius:8px; text-decoration:none }
      main { max-width:1100px; margin:60px auto; padding:20px }
      .image img { max-width:360px; width:100%; height:auto }
    </style>
</head>
<body>
<main id="main" class="main">
    <div class="menu">
        <a href="/">
            <h1 class="Logo">Iraq Game</h1>
        </a>
    </div>

    <div class="text-404">
        <h1>4 X 4</h1>
        <p>Page not found!</p>
        <a class="back-btn" href="/">Back To Home</a>
    </div>

    <div class="image"><img id="big_image" src="https://mjavadh.github.io/4X4-Collection/Fantasy/Black%20Box/assets/astronaut.png" alt="astronaut"></div>
</main>

<!-- optional image gallery box (kept simple) -->
<div id="image-box" class="image-box" style="display:none">
    <div id="close_ImageBox">X</div>
    <img class="small_image active" src="https://mjavadh.github.io/4X4-Collection/Fantasy/Black%20Box/assets/astronaut.png" style="max-width:50%" alt="astronaut">
    <img class="small_image" src="https://mjavadh.github.io/4X4-Collection/Fantasy/Black%20Box/assets/cute-ghost.png" style="max-width:80%" alt="ghost">
</div>

<script>
    // small interaction: toggle image-box when clicking big image
    const bigImage = document.getElementById('big_image');
    const imageBox = document.getElementById('image-box');
    const closeBtn = document.getElementById('close_ImageBox');
    if (bigImage && imageBox) {
      bigImage.style.cursor = 'pointer';
      bigImage.addEventListener('click', () => imageBox.style.display = 'block');
    }
    if (closeBtn && imageBox) closeBtn.addEventListener('click', () => imageBox.style.display = 'none');
</script>

</body>
</html>
