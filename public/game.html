<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفاصيل اللعبة | iraq story game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="detail-wrap">
      <div class="detail-topbar">
        <a class="btn-secondary" href="/">عودة للرئيسية</a>
        <!-- Admin link hidden from UI; page still accessible if direct URL is known -->
      </div>

      <!-- Contact manager button -->
      <a class="contact-manager" href="https://wa.me/7713377783" target="_blank" rel="noopener noreferrer" aria-label="تواصل مع المدير">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="wa" /> تواصل مع المدير
      </a>

      <section id="detailStatus" class="status" aria-live="polite"></section>

      <article id="detailCard" class="detail-card hidden">
        <img id="detailImage" class="detail-image" alt="غلاف اللعبة" />
        <div class="detail-content">
          <h1 id="detailName"></h1>
          <p id="detailCompany" class="detail-company"></p>
          <p id="detailMeta" class="detail-meta"></p>
          <p id="detailDescription" class="detail-description"></p>
          <p id="detailPrice" class="detail-price">مجانية</p>
          <div class="purchase-row">
            <label style="display:block;margin-bottom:6px">كود الخصم</label>
            <input id="couponInput" placeholder="رمز الكوبون (اختياري)" />
            <button id="applyCouponBtn" class="btn-secondary" type="button">تطبيق الكوبون</button>
            <div id="discountInfo" style="margin-top:8px;color:#aaffaa"></div>
            <button id="buyBtn" class="btn-primary" style="margin-top:12px">شراء عبر واتساب</button>
          </div>
        </div>
      </article>
    </main>

    <script src="/game.js" defer></script>
  </body>
</html>
