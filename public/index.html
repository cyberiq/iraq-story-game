<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المتجر | كل الألعاب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #0a0b12;
        --bg-2: #12141f;
        --surface: #171a29;
        --surface-2: #1e2233;
        --border: rgba(255, 255, 255, 0.08);
        --purple: #8b5cf6;
        --cyan: #33e0c8;
        --pink: #ef5ea6;
        --gold: #f5b942;
        --muted: #9298b3;
        --white: #f2f3fb;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: 'Tajawal', sans-serif;
        background:
          radial-gradient(ellipse 700px 400px at 85% -5%, rgba(139, 92, 246, 0.20), transparent 60%),
          radial-gradient(ellipse 600px 400px at 5% 15%, rgba(51, 224, 200, 0.12), transparent 60%),
          linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--white);
      }

      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }
      button { cursor: pointer; }

      .store-header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(10, 11, 18, 0.82);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }

      .header-bar {
        max-width: 1180px;
        margin: 0 auto;
        padding: 14px 20px 12px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .cart-button,
      .lang-pill,
      .search-shell {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        color: var(--white);
        border-radius: 14px;
      }

      .cart-button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        font-size: 15px;
        min-width: 120px;
        justify-content: center;
        background: rgba(255, 255, 255, 0.02);
      }

      .cart-button #cartCount {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--purple), var(--pink));
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }

      .lang-pill {
        padding: 10px 14px;
        font-size: 12px;
        min-width: 90px;
        text-align: center;
        background: rgba(255, 255, 255, 0.02);
      }

      .search-shell {
        flex: 1;
        max-width: 440px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
      }

      .search-shell svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
      }

      .search-shell input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--white);
        font-size: 14px;
      }

      .search-shell input::placeholder {
        color: var(--muted);
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-inline-start: auto;
        font-family: 'Baloo 2', sans-serif;
        font-size: 18px;
        font-weight: 800;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--purple), var(--cyan));
        display: grid;
        place-items: center;
        color: #0a0b12;
        font-size: 14px;
      }

      .category-bar {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 20px 14px;
        display: flex;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .category-pill {
        background: transparent;
        color: var(--muted);
        border: none;
        border-bottom: 2px solid transparent;
        padding: 6px 8px 10px;
        font-size: 14px;
        transition: all 0.2s ease;
      }

      .category-pill.active {
        color: var(--white);
        border-color: var(--purple);
        font-weight: 700;
      }

      .market-main {
        max-width: 1180px;
        margin: 22px auto 60px;
        padding: 0 20px;
      }

      .market-hero {
        border-radius: 28px;
        padding: 28px 24px;
        background: linear-gradient(135deg, rgba(117, 146, 184, 0.22), rgba(125, 74, 179, 0.66));
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .hero-kicker {
        display: none;
      }

      .market-hero h1 {
        font-family: 'Baloo 2', sans-serif;
        font-size: clamp(28px, 4vw, 50px);
        line-height: 1.15;
        text-align: center;
        margin: 0 auto 12px;
        max-width: 760px;
      }

      .hero-subtitle {
        max-width: 740px;
        margin: 0 auto;
        text-align: center;
        color: rgba(255,255,255,0.8);
        font-size: 16px;
        line-height: 1.9;
      }

      .status {
        margin-top: 16px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .offers-strip {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      .offer-pill {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        color: var(--white);
      }

      .company-grid {
        margin-top: 26px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }

      .company-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        padding: 14px;
      }

      .company-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .company-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .company-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 22px;
        background: rgba(255,255,255,0.06);
      }

      .company-name {
        font-size: 15px;
        font-weight: 700;
      }

      .company-slug {
        font-size: 12px;
        color: var(--muted);
      }

      .company-pill {
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 11px;
      }

      .games-list {
        display: grid;
        gap: 12px;
      }

      .game-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .game-cover {
        width: 100%;
        height: 140px;
        object-fit: cover;
        display: block;
      }

      .game-content {
        padding: 12px;
      }

      .game-name {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }

      .game-meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .game-price-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 12px;
      }

      .game-price {
        color: var(--gold);
        font-weight: 800;
        font-size: 15px;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .add-to-cart,
      .details-link {
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.04);
        color: var(--white);
        padding: 8px 12px;
        font-size: 12px;
      }

      .add-to-cart {
        background: linear-gradient(135deg, var(--purple), #6d3fd4);
        border-color: transparent;
      }

      .details-link {
        color: var(--cyan);
      }

      .cart-panel {
        position: fixed;
        top: 84px;
        left: 20px;
        width: min(360px, calc(100vw - 32px));
        background: rgba(13, 16, 28, 0.96);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 22px 46px rgba(0,0,0,0.38);
        z-index: 60;
      }

      .cart-panel.hidden {
        display: none;
      }

      .cart-items {
        display: grid;
        gap: 10px;
      }

      .cart-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }

      .delete-item-btn {
        background: rgba(239, 91, 107, 0.12);
        color: #ff9aa4;
        border: 1px solid rgba(239, 91, 107, 0.28);
        border-radius: 8px;
        padding: 6px 10px;
      }

      @media (max-width: 980px) {
        .company-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 720px) {
        .header-bar {
          flex-wrap: wrap;
          justify-content: center;
        }
        .brand-wrap {
          margin-inline-start: 0;
          order: 2;
        }
        .search-shell {
          order: 3;
          width: 100%;
          max-width: none;
        }
        .company-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="store-header">
      <div class="header-bar">
        <button id="cartButton" class="cart-button" type="button">السلة <span id="cartCount">0</span></button>
        <button id="languageToggle" class="lang-pill" type="button">AR / EN</button>

        <label class="search-shell" aria-label="بحث">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="searchInput" type="search" placeholder="ابحث عن لعبة أو شركة..." autocomplete="off" list="searchSuggestions" />
          <datalist id="searchSuggestions"></datalist>
        </label>

        <div class="brand-wrap">
          <div class="brand-mark">IQ</div>
          <span>Iraq Game</span>
        </div>
      </div>

      <nav class="category-bar" aria-label="التصنيفات">
        <button type="button" class="category-pill active" data-filter="all">كل الألعاب</button>
        <button type="button" class="category-pill" data-filter="games">ألعاب</button>
        <button type="button" class="category-pill" data-filter="subscriptions">اشتراكات</button>
        <button type="button" class="category-pill" data-filter="playstation">بلايستيشن</button>
        <button type="button" class="category-pill" data-filter="xbox">إكس بوكس</button>
        <button type="button" class="category-pill" data-filter="deals">عروض اليوم</button>
      </nav>
    </header>

    <main class="market-main">
      <section class="market-hero">
        <p class="hero-kicker">كل الألعاب</p>
        <h1>كل الألعاب</h1>
        <p class="hero-subtitle">تصفح جميع الألعاب والاشتراكات في واجهة متجر واحدة واضحة وسهلة.</p>
      </section>

      <section id="status" class="status" aria-live="polite"></section>
      <section id="todayOffers" class="offers-strip" aria-live="polite"></section>
      <section id="catalog" class="company-grid"></section>
    </main>

    <template id="companyTemplate">
      <article class="company-card">
        <div class="company-header">
          <div class="company-brand">
            <span class="company-icon" aria-hidden="true">🎮</span>
            <div>
              <h2 class="company-name"></h2>
              <p class="company-slug"></p>
            </div>
          </div>
          <span class="company-pill"></span>
        </div>
        <div class="games-list"></div>
      </article>
    </template>

    <template id="gameTemplate">
      <article class="game-card" data-game-id="">
        <img class="game-cover" alt="صورة اللعبة" loading="lazy" />
        <div class="game-content">
          <h3 class="game-name"></h3>
          <p class="game-meta"></p>
          <div class="game-price-row">
            <span class="game-price">₪0</span>
            <div class="card-actions">
              <button class="add-to-cart" type="button">إضافة للسلة</button>
              <a class="details-link" href="#">اشتر الآن</a>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="/cart-widget.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
