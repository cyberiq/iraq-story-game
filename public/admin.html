<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة الإدارة | iraq story game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="admin-wrap">
      <div class="admin-topbar">
        <h1>لوحة إدارة iraq story game</h1>
        <div class="topbar-actions">
          <a class="btn-secondary" href="/">العودة للرئيسية</a>
          <a class="btn-secondary" href="/admin/password">تغيير كلمة المرور</a>
          <button type="button" id="logoutBtn" class="btn-secondary">تسجيل خروج</button>
        </div>
      </div>

      <section id="adminStatus" class="status" aria-live="polite"></section>

      <section class="admin-grid">
        <article class="admin-card">
          <h2>إضافة / تعديل شركة</h2>
          <form id="companyForm" class="form-grid">
            <input id="companyId" type="hidden" />
            <label>
              <span>Slug</span>
              <input id="companySlug" required placeholder="example-company" />
            </label>
            <label>
              <span>اسم الشركة عربي</span>
              <input id="companyNameAr" required placeholder="اسم الشركة" />
            </label>
            <label>
              <span>اسم الشركة إنجليزي</span>
              <input id="companyNameEn" required placeholder="Company Name" />
            </label>
            <div class="form-actions">
              <button type="submit" class="btn-primary">حفظ الشركة</button>
              <button type="button" id="companyReset" class="btn-secondary">تفريغ</button>
            </div>
          </form>
        </article>

        <article class="admin-card">
          <h2>إضافة / تعديل لعبة</h2>
          <form id="gameForm" class="form-grid">
            <input id="gameId" type="hidden" />
            <label>
              <span>الشركة</span>
              <select id="gameCompany" required></select>
            </label>
            <label>
              <span>اسم اللعبة عربي</span>
              <input id="gameNameAr" required />
            </label>
            <label>
              <span>اسم اللعبة إنجليزي</span>
              <input id="gameNameEn" required />
            </label>
            <label>
              <span>النوع</span>
              <input id="gameGenre" required placeholder="Action / Shooter / RPG" />
            </label>
            <label>
              <span>فئة المنتج</span>
              <select id="gameProductType">
                <option value="game">لعبة</option>
                <option value="steam_card">بطاقة Steam</option>
                <option value="account">حساب (مثال: حساب ببجي، حساب Steam)</option>
                <option value="ps_card">بطاقة PlayStation</option>
                <option value="xbox_card">بطاقة Xbox</option>
                <option value="token">رمز / توكين</option>
              </select>
            </label>
            <label>
              <span>سنة الإصدار</span>
              <input id="gameYear" type="number" min="1970" max="2100" required />
            </label>
            <label>
              <span>سعر المنتج (مثال: 10,000)</span>
              <input id="gamePrice" type="text" inputmode="numeric" pattern="[0-9,]*" placeholder="10,000" />
            </label>
            <label>
              <span>العملة</span>
              <select id="gameCurrency">
                <option value="IQD">دينار عراقي (IQD)</option>
                <option value="USD">دولار أمريكي (USD)</option>
              </select>
            </label>
            <label>
              <span>صورة اللعبة من الجهاز</span>
              <input id="gameImage" type="file" accept="image/*" />
            </label>
            <label>
              <span>أو رابط صورة اللعبة</span>
              <input id="gameImageUrl" type="url" placeholder="https://example.com/image.jpg" />
            </label>
            <div class="image-preview">
              <label>معاينة الصورة</label>
              <div>
                <img id="gameImagePreview" src="" alt="معاينة الصورة" style="max-width:100%;max-height:360px;object-fit:contain;display:none;border:1px solid #444;padding:4px;background:#111;" />
              </div>
            </div>
            <p id="gameImageHint" class="hint-text"></p>
            <label>
              <span>وصف اللعبة</span>
              <textarea id="gameDescription" rows="4" placeholder="وصف مختصر"></textarea>
            </label>
            <label id="productSubtypeLabel" style="display:none;">
              <span>تفصيل الفئة (مثال: حساب ببجي موبايل، حساب Steam)</span>
              <input id="gameProductDetail" placeholder="مثال: PUBG Mobile / Steam" />
            </label>
            <div class="form-actions">
              <button type="submit" class="btn-primary">حفظ اللعبة</button>
              <button type="button" id="gameReset" class="btn-secondary">تفريغ</button>
            </div>
          </form>
        </article>
      </section>

      <section class="admin-card">
        <h2>الشركات والألعاب الحالية</h2>
        <p class="hint-text">ملاحظة: حذف شركة سيحذف جميع ألعابها.</p>
        <div id="adminCatalog" class="admin-catalog"></div>
      </section>
      <section class="admin-card">
        <h2>إدارة كوبونات التخفيض</h2>
        <form id="couponForm" class="form-grid">
          <label>
            <span>رمز الكوبون</span>
            <input id="couponCode" required placeholder="SAVE10" />
          </label>
          <label>
            <span>نسبة الخصم (%)</span>
            <input id="couponPercent" type="number" min="1" max="100" value="10" />
          </label>
          <div class="form-actions">
            <button type="submit" class="btn-primary">إضافة الكوبون</button>
          </div>
        </form>
        <div id="couponList" class="coupon-list"></div>
      </section>

      <section class="admin-card">
        <h2>إعدادات واتساب</h2>
        <form id="whatsappSettingsForm" class="form-grid">
          <label>
            <span>رقم واتساب</span>
            <input id="whatsappNumberInput" type="tel" placeholder="966500000000" />
          </label>
          <div class="form-actions">
            <button type="submit" class="btn-primary">حفظ رقم الواتساب</button>
          </div>
        </form>
      </section>

      <section class="admin-card">
        <h2>عروض اليوم</h2>
        <form id="todayOffersForm" class="form-grid">
          <input id="offerEditId" type="hidden" />
          <label>
            <span>اسم المنتج / المتجر</span>
            <input id="offerProductName" placeholder="اكتب اسم المنتج أو المتجر يدوياً" />
          </label>
          <label>
            <span>اختيار منتج سابق (اختياري)</span>
            <select id="offerGameSelect">
              <option value="">-- لا تستخدم اختياري --</option>
            </select>
          </label>
          <label>
            <span>اسم العرض</span>
            <input id="offerTitle" placeholder="عرض اليوم / خصم العطل" />
          </label>
          <label>
            <span>سعر العرض (د.ع)</span>
            <input id="offerPrice" type="number" min="0" step="0.01" placeholder="5000" />
          </label>
          <label>
            <span>نسبة الخصم (%)</span>
            <input id="offerPercent" type="number" min="0" max="100" placeholder="20" />
          </label>
          <div class="form-actions">
            <button type="submit" class="btn-primary">حفظ العرض</button>
            <button type="button" class="btn-secondary" id="resetOfferFormBtn">إلغاء التعديل</button>
          </div>
        </form>
        <div id="todayOffersList" class="coupon-list"></div>
      </section>
    </main>

    <!-- Contact manager button -->
    <a class="contact-manager" href="/contact" aria-label="صفحة تواصل">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="wa" /> تواصل مع المدير
    </a>

    <script src="/admin-assets/admin.js" defer></script>
  </body>
</html>
